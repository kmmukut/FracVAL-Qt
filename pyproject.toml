[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fracval-qt"
version = "1.1.0"
description = "Modern Python API and native Qt GUI for the original FracVAL Fortran fractal aggregate generator"
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Fortran",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "plotly>=5.18",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
plot = ["matplotlib>=3.7", "jupyterlab>=4"]
dev = ["pytest>=7"]

[project.scripts]
fracval-python = "fracval.cli:main"
fracval-gui = "fracval.desktop.main:main"
fracval-qt-check = "fracval.desktop.qt_runtime:main"
fracval-info = "fracval.diagnostics:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
fracval = [
  "py.typed",
  "_fracval_fortran.pyf",
  "_fracval_fortran*.so",
  "_fracval_fortran*.pyd",
  "*.dll",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
addopts = "-ra"

name: core-tests

on:
  push:
  pull_request:

jobs:
  linux-apt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Build standalone Fortran generator
        # Treat free-form line truncation as an error so source remains portable
        # across GNU Fortran versions (Fortran free-form limit: 132 columns).
        run: make -j2 FFLAGS='-O2 -Werror=line-truncation'

      - name: Build the F2PY extension
        run: python tools/build.py ext

      - name: Run deterministic Fortran/Python regression suite
        run: python -m pytest --ignore=tests/python/test_qt_gui.py

  conda-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            env-file: environment.yml
          - os: macos-latest
            env-file: environment.yml
          - os: windows-latest
            env-file: environment-windows.yml
    defaults:
      run:
        shell: bash -el {0}
    env:
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --no-sandbox'
      FRACVAL_RUN_GUI_TESTS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux libraries needed by headless QtWebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: ${{ matrix.env-file }}
          activate-environment: fracval
          auto-activate-base: false

      - name: Report toolchain
        run: |
          conda list
          gfortran --version
          gcc --version

      - name: Install FracVAL (editable) with GUI and dev extras
        run: python -m pip install -e ".[gui,dev]"

      - name: Build executable and F2PY extension
        run: python tools/build.py all

      - name: Diagnostics
        run: |
          fracval-info
          fracval-qt-check || true

      - name: Run the pytest suite (Fortran CLI + Python API + Qt paths)
        run: python -m pytest --ignore=tests/python/test_qt_gui.py

      - name: Report Qt import status on Windows (diagnostic, non-fatal)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          python -c "import traceback
          try:
              from PySide6.QtCore import QLibraryInfo
              print('QtCore OK', QLibraryInfo.build())
          except Exception:
              traceback.print_exc()"
          echo "--- Qt/ICU/zlib-like DLLs in the conda Library/bin that can shadow the wheel ---"
          ls "$CONDA_PREFIX/Library/bin" | grep -iE '^(Qt6|icu|zlib|zstd|libpng|freetype|harfbuzz|double-conversion|pcre|brotli|openssl|libssl|libcrypto|md4c)' || echo "(none matched)"
          echo "--- same names shipped inside the PySide6 wheel ---"
          python -c "import PySide6, pathlib; d=pathlib.Path(PySide6.__file__).parent; print(d); print('\n'.join(sorted(p.name for p in d.glob('*.dll'))[:60]))"

      # The Windows runner cannot import Qt from the pip PySide6 wheel inside a
      # conda environment: QtCore fails with "DLL load failed ... The specified
      # procedure could not be found" (Windows error 127), a DLL version clash
      # with %CONDA_PREFIX%\Library\bin. fracval-qt-check (which inspects the
      # plugin layout without importing QtWidgets) passes on this runner, so per
      # design-spec section 9 item 3 the GUI construction test is maintainer-machine
      # verified on Windows. Evidence:
      # https://github.com/kmmukut/FracVAL-Qt/actions/runs/33742397286
      # Remove continue-on-error once the import works on windows-latest.
      - name: Headless Qt GUI construction smoke test
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: python -m pytest tests/python/test_qt_gui.py -s

name: core-tests

on:
  push:
  pull_request:

jobs:
  linux-apt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GNU Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Build standalone Fortran generator
        # Treat free-form line truncation as an error so source remains portable
        # across GNU Fortran versions (Fortran free-form limit: 132 columns).
        run: make -j2 FFLAGS='-O2 -Werror=line-truncation'

      - name: Build the F2PY extension
        run: python tools/build.py ext

      - name: Run deterministic Fortran/Python regression suite
        run: python -m pytest --ignore=tests/python/test_qt_gui.py

  conda-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            env-file: environment.yml
          - os: macos-latest
            env-file: environment.yml
          - os: windows-latest
            env-file: environment-windows.yml
    defaults:
      run:
        shell: bash -el {0}
    env:
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --no-sandbox'
      FRACVAL_RUN_GUI_TESTS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux libraries needed by headless QtWebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

      - name: Set up Miniforge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: ${{ matrix.env-file }}
          activate-environment: fracval
          auto-activate-base: false

      - name: Report toolchain
        run: |
          conda list
          gfortran --version
          gcc --version

      - name: Install FracVAL (editable) with GUI and dev extras
        run: python -m pip install -e ".[gui,dev]"

      - name: Diagnose MinGW toolchain layout (temporary; remove once Windows CI is green)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          echo "FFLAGS=$FFLAGS"
          echo "CFLAGS=$CFLAGS"
          echo "LDFLAGS=$LDFLAGS"
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          echo "--- locate crt2.o / default-manifest.o ---"
          find "$CONDA_PREFIX" -name 'crt2.o' -o -name 'default-manifest.o' 2>/dev/null | head -20
          echo "--- gcc's own search dirs ---"
          x86_64-w64-mingw32-gcc -print-search-dirs | head -20
          echo "--- libgcc / crt file lookup ---"
          x86_64-w64-mingw32-gcc -print-file-name=crt2.o
          x86_64-w64-mingw32-gcc -print-libgcc-file-name
          echo "--- installed mingw/gcc packages ---"
          conda list | grep -Ei 'mingw|gcc|gfortran|crt|binutils' || true

      - name: Build executable and F2PY extension
        run: python tools/build.py all

      - name: Diagnostics
        run: |
          fracval-info
          fracval-qt-check || true

      - name: Run the pytest suite (Fortran CLI + Python API + Qt paths)
        run: python -m pytest --ignore=tests/python/test_qt_gui.py

      - name: Probe PySide6 import (temporary; remove once Windows CI is green)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          python -c "import PySide6, sys; print('PySide6', PySide6.__version__ if hasattr(PySide6,'__version__') else '?', sys.version)"
          python -c "import traceback
          try:
              from PySide6.QtCore import QLibraryInfo
              print('QtCore OK', QLibraryInfo.build())
          except Exception:
              traceback.print_exc()"
          python -c "import traceback
          try:
              from PySide6.QtWidgets import QApplication
              print('QtWidgets OK')
          except Exception:
              traceback.print_exc()"
          python -c "import traceback
          try:
              from PySide6.QtWebEngineWidgets import QWebEngineView
              print('QtWebEngineWidgets OK')
          except Exception:
              traceback.print_exc()"

      - name: Headless Qt GUI construction smoke test
        run: python -m pytest tests/python/test_qt_gui.py -s
